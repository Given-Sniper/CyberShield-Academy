name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cybershield
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cybershield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybershield -d cybershield_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://cybershield:test-only-password@localhost:5432/cybershield_test
      SECRET_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: flask --app run db upgrade
      - run: python verify_setup.py
      - run: flask --app run db check
      - run: flask --app run db downgrade base
